# the broker started by StartKafkaBroker (module spring-kafka-broker)
spring.kafka.bootstrap-servers=localhost:9093
# message values travel as JSON: NewUser -> {"name":..,"username":..} -> NewUser
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# the deserializer only instantiates classes from these packages (named in the __TypeId__ header)
spring.kafka.consumer.properties.spring.json.trusted.packages=victor.training.spring.kafka
