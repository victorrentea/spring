spring:
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    username: user
    password: pass
props:
  env: prod
  gate: 123
  welcome-message: Hello
  supportUrls:
    - http://stackoverflow.com
    - http://baeldung.com
    - http://spring.io
  contactPhones: # Map
    FR: 430123414123
    RO: 401312121414
  help:
    app-id: 1251
    file: c:/help-file.pdf
    email: victorrentea+yourWebSite@gmail.com
  tenants:
    FR:
      greeting: Bonjour!
      lunch: PT3h
    RO:
      greeting: Salut!
      lunch: PT30m
management:
  endpoints:
    web:
      exposure:
        include: "*" #risky in prod
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true   # exposes /actuator/health/liveness and /actuator/health/readiness
      show-details: always
      group:
        readiness: #if failed the app will not receive traffic
          include: mail
        liveness: # if failed the app will be restarted
          include: ping   # or whatever you use for liveness

